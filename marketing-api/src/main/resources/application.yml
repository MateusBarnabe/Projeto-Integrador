# Configuração do módulo marketing. Todo endereço e credencial vem de variável de ambiente
# (Contrato §9.1); os valores padrão servem para rodar local com o docker-compose da raiz.

server:
  port: ${SERVER_PORT:8087}
  # O token de ADMINISTRADOR é grande (Contrato §4.4)
  max-http-request-header-size: 32KB
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: marketing

  # A aplicação roda como usr_marketing; o Flyway, como own_marketing (Contrato §7.1)
  datasource:
    # Mesmos nomes de variável do docker-compose.yml da plataforma (infra-integrador-2026)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plataforma}
    username: ${DB_APP_USER:usr_marketing}
    password: ${DB_APP_PASSWORD:usr_marketing}
  flyway:
    user: ${DB_OWNER_USER:own_marketing}
    password: ${DB_OWNER_PASSWORD:own_marketing}
    schemas: marketing
    default-schema: marketing
    create-schemas: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: marketing
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

  # Conecta como mq_marketing: a propriedade user_id das mensagens precisa bater com o usuário (§9.7)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:mq_marketing}
    password: ${RABBITMQ_PASSWORD:mq_marketing}
    virtual-host: ${RABBITMQ_VHOST:plataforma}
    # Consumo (F4): 3 tentativas e, esgotadas, rejeita sem voltar à fila → <fila>.dlq (§9.7)
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

  # JWKS do identity (§4.2), no caminho que o compose da plataforma usa
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/api/identity/.well-known/jwks.json}

# Swagger UI em /swagger-ui.html e OpenAPI em /v3/api-docs. O gateway da plataforma só encaminha
# /api/marketing/**, então esses caminhos não saem pela plataforma; SWAGGER_HABILITADO=false desliga.
springdoc:
  api-docs:
    enabled: ${SWAGGER_HABILITADO:true}
  swagger-ui:
    enabled: ${SWAGGER_HABILITADO:true}
  paths-to-match: /api/marketing/**, /public/marketing/**

# Chamadas a outros módulos (§9.1, §9.2, §9.6): direto pelo nome do container, nunca pelo gateway,
# com token de serviço (clientId = marketing) e X-Tenant-Id, timeout de 3 s. Os padrões são os
# endereços da rede do compose da plataforma; o IDENTITY_BASE_URL e o SVC_* vêm de lá.
marketing:
  integracao:
    timeout: 3s
    identity-base-url: ${IDENTITY_BASE_URL:http://identity:8081}
    landing-base-url: ${LANDING_BASE_URL:http://landing:8088}
    crm-base-url: ${CRM_BASE_URL:http://crm:8082}
    servico:
      client-id: ${SVC_CLIENT_ID:marketing}
      client-secret: ${SVC_CLIENT_SECRET:}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
