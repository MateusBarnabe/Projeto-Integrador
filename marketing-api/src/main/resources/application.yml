# Configuração do módulo marketing. Todo endereço e credencial vem de variável de ambiente
# (Contrato §9.1); os valores padrão servem para rodar local com o docker-compose da raiz.

server:
  port: ${SERVER_PORT:8087}
  # O token de ADMINISTRADOR é grande (Contrato §4.4)
  max-http-request-header-size: 32KB
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: marketing

  # A aplicação roda como usr_marketing; o Flyway, como own_marketing (Contrato §7.1)
  datasource:
    # Mesmos nomes de variável do docker-compose.yml da plataforma (infra-integrador-2026)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plataforma}
    username: ${DB_APP_USER:usr_marketing}
    password: ${DB_APP_PASSWORD:usr_marketing}
  flyway:
    user: ${DB_OWNER_USER:own_marketing}
    password: ${DB_OWNER_PASSWORD:own_marketing}
    schemas: marketing
    default-schema: marketing
    create-schemas: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: marketing
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

  # Conecta como mq_marketing: a propriedade user_id das mensagens precisa bater com o usuário (§9.7)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:mq_marketing}
    password: ${RABBITMQ_PASSWORD:mq_marketing}
    virtual-host: ${RABBITMQ_VHOST:plataforma}
    # Consumo (F4): 3 tentativas e, esgotadas, rejeita sem voltar à fila → <fila>.dlq (§9.7)
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

  # JWKS do identity (§4.2), no caminho que o compose da plataforma usa
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/api/identity/.well-known/jwks.json}

  # E-mail (E8/E9): Mailpit local por padrão (localhost:1025)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 3000
          timeout: 3000
          writetimeout: 3000

# Swagger UI em /swagger-ui.html e OpenAPI em /v3/api-docs. O gateway da plataforma só encaminha
# /api/marketing/**, então esses caminhos não saem pela plataforma; SWAGGER_HABILITADO=false desliga.
springdoc:
  api-docs:
    enabled: ${SWAGGER_HABILITADO:true}
  swagger-ui:
    enabled: ${SWAGGER_HABILITADO:true}
  paths-to-match: /api/marketing/**, /public/marketing/**

# Chamadas a outros módulos (§9.1, §9.2, §9.6): direto pelo nome do container, nunca pelo gateway,
# com token de serviço (clientId = marketing) e X-Tenant-Id, timeout de 3 s. Os padrões são os
# endereços da rede do compose da plataforma; o IDENTITY_BASE_URL e o SVC_* vêm de lá.
marketing:
  integracao:
    timeout: 3s
    identity-base-url: ${IDENTITY_BASE_URL:http://identity:8081}
    landing-base-url: ${LANDING_BASE_URL:http://landing:8088}
    crm-base-url: ${CRM_BASE_URL:http://crm:8082}
    servico:
      client-id: ${SVC_CLIENT_ID:marketing}
      client-secret: ${SVC_CLIENT_SECRET:}

  # Rastreamento do clique no anúncio (R1). A URL pública é o endereço que o navegador do visitante
  # alcança (o gateway, na plataforma): monta o link do anúncio e a tag do script da landing page.
  rastreamento:
    url-publica: ${MARKETING_URL_PUBLICA:http://localhost:8087}
    # Simulador da localização por IP; trocar por uma base GeoIP é outra implementação de LocalizacaoPorIp
    localizacao-simulada:
      habilitada: ${RASTREAMENTO_LOCALIZACAO_SIMULADA:true}

  # Painel (A4 e R6): cache das agregações por tenant e filtros, e fluxo SSE de eventos dos leads
  painel:
    cache:
      # 0 desliga o cache
      ttl: 30s
      tamanho-maximo: 500
    sse:
      # De quanto em quanto tempo cada conexão consulta lead_eventos e visitas_anuncio
      intervalo-consulta: 2s
      # Comentário ": ping", para o gateway não fechar a conexão parada
      intervalo-ping: 15s
      limite-por-tenant: 20
      # Teto da conexão; vale o que vencer primeiro entre ele e a expiração do token
      duracao-maxima: 30m
      lote: 200
      threads: 4

  # Segredos dos canais de anúncio cifrados em repouso (D6) e remetente de e-mails (E8/E9). A chave
  # não tem padrão aqui (só no perfil dev): sem ela, a API recusa gravar os segredos do Meta (503).
  seguranca:
    chave-cifra: ${MARKETING_CHAVE_CIFRA:}
  comunicacao:
    remetente: ${MAIL_FROM:marketing@centinela.local}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
