# CI do módulo Marketing, a partir do exemplo-modulo/.github/workflows/ci.yml do infra-integrador-2026.
# Roda os testes em todo push na main e em todo pull request; a cada push na main (merge) publica
# as imagens marketing e marketing-front no GHCR da conta dona do repositório, com :latest e
# :sha-{commit}, pelo workflow reutilizável da plataforma (Contrato §14.3, checklist item 14).
# O landing-web é placeholder local e não ganha imagem.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes (Testcontainers usa o Docker do runner)
        working-directory: marketing-api
        run: ./mvnw -B verify

  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: marketing-web/package-lock.json
      - name: Build (tsc + vite)
        working-directory: marketing-web
        run: |
          npm ci
          npm run build

  publicar-api:
    if: github.event_name == 'push'
    needs: [api]
    permissions:
      contents: read
      packages: write
    uses: karolAlbuquerque/infra-integrador-2026/.github/workflows/publicar-imagem.yml@main
    with:
      imagem: marketing
      contexto: marketing-api

  publicar-front:
    if: github.event_name == 'push'
    needs: [front]
    permissions:
      contents: read
      packages: write
    uses: karolAlbuquerque/infra-integrador-2026/.github/workflows/publicar-imagem.yml@main
    with:
      imagem: marketing-front
      contexto: marketing-web
