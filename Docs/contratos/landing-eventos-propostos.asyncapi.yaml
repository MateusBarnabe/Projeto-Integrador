asyncapi: 3.0.0
info:
  title: Landing Pages e Formulários — eventos que o Marketing precisa (proposta)
  version: 0.2.0-proposta
  description: |
    RASCUNHO escrito pelo Grupo 4 (Marketing) para o Grupo 7 (Landing). O dono destes eventos
    é o Landing: este arquivo é uma sugestão para ser incorporada ao `contratos/landing.asyncapi.yaml`
    do `infra-integrador-2026`, com os nomes e ajustes que o Landing decidir.

    Parte de `landing.formulario.recebido`, já proposto no PR #16, e acrescenta:
    - quatro eventos para as etapas 0, 1 e 2 do lead;
    - `visitanteId`, `formularioVersao`, `contato`, `consentimento` e `origem` (UTM) no evento de envio.

    O Marketing consome todos pela fila `marketing.landing-leads`. A etapa do lead é calculada
    pelo Marketing: o Landing só informa o que o visitante fez. Explicação completa em
    `landing-requisitos.md`, na mesma pasta.

    Regras do Contrato de Integração §9.7: publicar depois do commit, com a propriedade AMQP
    `user_id = mq_landing`, e sem dado pessoal além do necessário. As respostas do formulário
    não vão no evento; o Marketing as consulta em `GET /api/landing/envios/{envioId}`.
defaultContentType: application/json

servers:
  desenvolvimento:
    host: localhost:5672
    protocol: amqp
    protocolVersion: 0.9.1
    description: RabbitMQ do infra-integrador-2026, vhost `plataforma`

channels:
  eventos:
    address: landing.eventos
    messages:
      visitaRegistrada:
        $ref: '#/components/messages/VisitaRegistrada'
      formularioAberto:
        $ref: '#/components/messages/FormularioAberto'
      contatoInformado:
        $ref: '#/components/messages/ContatoInformado'
      formularioAtualizado:
        $ref: '#/components/messages/FormularioAtualizado'
      formularioRecebido:
        $ref: '#/components/messages/FormularioRecebido'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: landing.eventos
          type: topic
          durable: true
          autoDelete: false
          vhost: plataforma
        bindingVersion: 0.3.0

operations:
  publicarVisitaRegistrada:
    action: send
    summary: Etapa 0 — visitante chegou por anúncio e não interagiu
    channel:
      $ref: '#/channels/eventos'
    messages:
      - $ref: '#/channels/eventos/messages/visitaRegistrada'
  publicarFormularioAberto:
    action: send
    summary: Etapa 0 — visitante clicou em "fale conosco" sem preencher
    channel:
      $ref: '#/channels/eventos'
    messages:
      - $ref: '#/channels/eventos/messages/formularioAberto'
  publicarContatoInformado:
    action: send
    summary: Etapa 1 — visitante preencheu nome, telefone e e-mail
    channel:
      $ref: '#/channels/eventos'
    messages:
      - $ref: '#/channels/eventos/messages/contatoInformado'
  publicarFormularioAtualizado:
    action: send
    summary: Etapa 2 — visitante avançou no formulário sem enviar
    channel:
      $ref: '#/channels/eventos'
    messages:
      - $ref: '#/channels/eventos/messages/formularioAtualizado'
  publicarFormularioRecebido:
    action: send
    summary: Etapa 3 — formulário enviado; empresa e contato já criados ou reaproveitados no CRM
    channel:
      $ref: '#/channels/eventos'
    messages:
      - $ref: '#/channels/eventos/messages/formularioRecebido'

components:
  messages:
    VisitaRegistrada:
      name: landing.visita.registrada
      title: Visita registrada
      summary: |
        Visitante chegou a uma landing page com parâmetros de campanha (utm_*, fbclid ou gclid).
        Visita orgânica sem campanha não é publicada. No máximo um evento por visitanteId por dia.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              tipo: { const: landing.visita.registrada }
              dados:
                type: object
                required: [visitanteId, paginaId, origem]
                properties:
                  visitanteId: { $ref: '#/components/schemas/VisitanteId' }
                  paginaId: { type: string, format: uuid }
                  origem: { $ref: '#/components/schemas/Origem' }

    FormularioAberto:
      name: landing.formulario.aberto
      title: Formulário aberto
      summary: Visitante clicou em "fale conosco" ou abriu o formulário e ainda não preencheu nada.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              tipo: { const: landing.formulario.aberto }
              dados:
                type: object
                required: [visitanteId, formularioId, origem]
                properties:
                  visitanteId: { $ref: '#/components/schemas/VisitanteId' }
                  formularioId: { type: string, format: uuid }
                  paginaId:
                    type: [string, 'null']
                    format: uuid
                    description: Nulo quando o formulário foi aberto por embed ou chatbot
                  origem: { $ref: '#/components/schemas/Origem' }

    ContatoInformado:
      name: landing.contato.informado
      title: Contato informado
      summary: |
        Visitante terminou de preencher nome, telefone e e-mail, antes de enviar o formulário.
        O envioId nasce aqui e é o mesmo até o envio final.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              tipo: { const: landing.contato.informado }
              dados:
                type: object
                required: [visitanteId, envioId, formularioId, formularioVersao, contato, consentimento, origem]
                properties:
                  visitanteId: { $ref: '#/components/schemas/VisitanteId' }
                  envioId: { type: string, format: uuid }
                  formularioId: { type: string, format: uuid }
                  formularioVersao: { type: integer, minimum: 1 }
                  contato: { $ref: '#/components/schemas/Contato' }
                  consentimento: { $ref: '#/components/schemas/Consentimento' }
                  origem: { $ref: '#/components/schemas/Origem' }

    FormularioAtualizado:
      name: landing.formulario.atualizado
      title: Formulário atualizado
      summary: |
        Visitante avançou no formulário depois do contato, sem enviar. Agrupado: no máximo um
        evento a cada 30 s por envioId, mais um quando o visitante sai da página. O Marketing
        decide a etapa a partir de `progresso`; as respostas ficam na API do Landing.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              tipo: { const: landing.formulario.atualizado }
              dados:
                type: object
                required: [visitanteId, envioId, formularioId, formularioVersao, progresso, contato, consentimento, origem]
                properties:
                  visitanteId: { $ref: '#/components/schemas/VisitanteId' }
                  envioId: { type: string, format: uuid }
                  formularioId: { type: string, format: uuid }
                  formularioVersao: { type: integer, minimum: 1 }
                  progresso: { $ref: '#/components/schemas/Progresso' }
                  contato: { $ref: '#/components/schemas/Contato' }
                  consentimento: { $ref: '#/components/schemas/Consentimento' }
                  origem: { $ref: '#/components/schemas/Origem' }

    FormularioRecebido:
      name: landing.formulario.recebido
      title: Formulário recebido
      summary: |
        Publicado depois do commit do envio e depois de criar ou reaproveitar empresa e contato no
        CRM (PR #16). O Landing não cria a oportunidade: quem cria é o Marketing, ao consumir este
        evento. Com o CRM fora do ar, publicar com empresaId e contatoId nulos e publicar de novo
        (novo `id`) quando os ids existirem.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              tipo: { const: landing.formulario.recebido }
              dados:
                type: object
                required: [envioId, formularioId, canal, visitanteId, formularioVersao, contato, consentimento, origem]
                properties:
                  envioId: { type: string, format: uuid }
                  formularioId: { type: string, format: uuid }
                  empresaId:
                    type: [string, 'null']
                    format: uuid
                    description: Empresa criada ou reaproveitada no CRM
                  contatoId:
                    type: [string, 'null']
                    format: uuid
                    description: Contato criado ou reaproveitado no CRM
                  canal:
                    type: string
                    enum: [formulario, landing_page, embed, chatbot]
                    description: Mantido do PR #16; o mesmo valor vem em origem.canal
                  visitanteId: { $ref: '#/components/schemas/VisitanteId' }
                  formularioVersao: { type: integer, minimum: 1 }
                  contato: { $ref: '#/components/schemas/Contato' }
                  consentimento: { $ref: '#/components/schemas/Consentimento' }
                  origem: { $ref: '#/components/schemas/Origem' }

  schemas:
    Envelope:
      type: object
      required: [id, tipo, versao, tenantId, moduloOrigem, ocorridoEm, dados]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string }
        versao: { type: integer, minimum: 1 }
        tenantId: { type: string, format: uuid }
        moduloOrigem: { type: string, const: landing }
        ocorridoEm: { type: string, format: date-time }
        usuarioId:
          type: [string, 'null']
          format: uuid
          description: Sempre nulo nestes eventos — o visitante não é usuário da plataforma
        correlacaoId: { type: [string, 'null'] }
        dados: { type: object }

    VisitanteId:
      type: string
      format: uuid
      description: |
        Gerado pelo Landing no primeiro acesso e mantido em cookie first-party (sugestão: 90 dias).
        O mesmo em todos os eventos do visitante.

    Origem:
      type: object
      description: |
        Campanha e página de origem. A UTM capturada na chegada acompanha o visitanteId nos
        eventos seguintes, mesmo em páginas sem UTM na URL.
      required: [landingPageUrl, primeiraVisitaEm, canal]
      properties:
        utmSource: { type: [string, 'null'], maxLength: 255 }
        utmMedium: { type: [string, 'null'], maxLength: 255 }
        utmCampaign: { type: [string, 'null'], maxLength: 255 }
        utmTerm: { type: [string, 'null'], maxLength: 255 }
        utmContent: { type: [string, 'null'], maxLength: 255 }
        fbclid: { type: [string, 'null'], maxLength: 500 }
        gclid: { type: [string, 'null'], maxLength: 500 }
        landingPageUrl:
          type: string
          format: uri
          description: URL da página, sem a query string
        referrer: { type: [string, 'null'], maxLength: 2000 }
        primeiraVisitaEm: { type: string, format: date-time }
        canal:
          type: string
          enum: [formulario, landing_page, embed, chatbot]

    Contato:
      type: object
      required: [nome, email, telefone]
      properties:
        nome: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email }
        telefone:
          type: string
          pattern: '^[0-9]{10,15}$'
          description: Só dígitos, com DDI e DDD (E.164 sem o +)
        whatsapp:
          type: [string, 'null']
          pattern: '^[0-9]{10,15}$'

    Consentimento:
      type: object
      required: [marketing, registradoEm]
      properties:
        marketing:
          type: boolean
          description: O visitante aceitou receber comunicação de marketing (LGPD)
        registradoEm: { type: string, format: date-time }

    Progresso:
      type: object
      required: [camposPreenchidos, camposTotal, obrigatoriosPreenchidos, obrigatoriosTotal]
      properties:
        camposPreenchidos: { type: integer, minimum: 0 }
        camposTotal: { type: integer, minimum: 1 }
        obrigatoriosPreenchidos: { type: integer, minimum: 0 }
        obrigatoriosTotal: { type: integer, minimum: 0 }
